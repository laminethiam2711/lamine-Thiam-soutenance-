name: APK Android GestNotes

# Construit l'application mobile Android (Capacitor) à partir du frontend Angular
# en mode démonstration (données intégrées, fonctionne sans serveur),
# puis publie le fichier .apk dans les « Releases » du dépôt.

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/apk-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Compiler l'application Angular (version démo)
        run: npx ng build --configuration demo

      - name: Copier le site dans le projet Android
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Construire l'APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../GestNotes.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GestNotes-apk
          path: GestNotes.apk

      - name: Publier l'APK dans les Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: GestNotes Android (version ${{ github.run_number }})
          body: |
            Application mobile Android de GestNotes (version de démonstration, fonctionne sans connexion).
            Téléchargez **GestNotes.apk** sur votre téléphone puis ouvrez-le pour l'installer
            (autorisez l'installation depuis des sources inconnues si Android le demande).

            Comptes de démonstration :
            - Administrateur : admin@ecole.sn / admin123
            - Enseignante : awa.ndiaye@ecole.sn / passer123
            - Étudiante : astou.diagne@ecole.sn / passer123
          files: GestNotes.apk
          make_latest: true
